name: PocketSequence
options:
  bundleIdPrefix: uk.co.lansystems
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  PocketSequence:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.lansystems.pocketsequence
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Pocket Sequence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Connect to your synthesizer to send MIDI notes over Bluetooth.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  PocketSequenceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PocketSequence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PocketSequence:
    build:
      targets:
        PocketSequence: all
    test:
      targets:
        - PocketSequenceUITests
